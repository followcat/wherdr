id = "afloury.wherdr"
name = "wherdr"
version = "2.4.0"
min_herdr_version = "0.9.1"
description = "Your Herdr agents from your phone and browser: live conversations, real terminals, push notifications and one-tap answers. Self-hosted, private network only."
platforms = ["linux", "macos"]

# Installs wherdr natively with Node.js 22 in ~/wherdr (WHERDR_DIR).
[[build]]
command = ["sh", "scripts/herdr-plugin.sh", "build"]

# One-shot on each Herdr start: starts wherdr detached, unless something
# already answers on its port (a wherdr started another way is left alone).
[[startup]]
command = ["sh", "scripts/herdr-plugin.sh", "start"]

# The main action: a popup with the state, the addresses, the phone QR code
# and a key per command (start, stop, restart, open, log, update, auto-start).
# The install binds it to a free Herdr key (scripts/herdr-plugin.sh key).
# Named "wherdr" up to 1.2.0: a key bound to afloury.wherdr.wherdr must be
# changed to afloury.wherdr.panel (Herdr manifests have no action aliases).
[[actions]]
id = "panel"
title = "wherdr"
contexts = ["global", "workspace"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin \"$HERDR_PLUGIN_ID\" --entrypoint panel --focus"]

[[actions]]
id = "open"
title = "wherdr: open in the browser"
contexts = ["global", "workspace"]
command = ["sh", "scripts/herdr-plugin.sh", "open"]

[[panes]]
id = "panel"
title = "wherdr"
placement = "popup"
width = "80%"
height = "90%"
command = ["sh", "scripts/herdr-plugin.sh", "panel"]
