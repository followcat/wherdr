# wherdr v3 is not a Herdr plugin: it runs on herdr-core (hc) and installs
# beside v2 (docs/migrate-from-v2.md). This manifest is kept only so that
# `herdr plugin install afloury/wherdr` and `herdr plugin update` on a v3
# commit stop with a clear message: its build fails at once, before touching
# anything, and Herdr then keeps the plugin already installed (v2) as it was.
id = "afloury.wherdr"
name = "wherdr"
version = "3.0.0-dev"
min_herdr_version = "0.9.1"
description = "wherdr v3 is not a Herdr plugin: install it beside v2, see docs/migrate-from-v2.md."
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "-c", '''
cat >&2 <<'MSG'
wherdr v3 is not a Herdr plugin, and nothing was changed: your wherdr v2
plugin stays installed and running as it was.
v3 runs on herdr-core (hc) and installs beside v2, from git:
  https://github.com/afloury/wherdr/blob/v3/docs/migrate-from-v2.md
To stay on v2, install the plugin from its branch:
  herdr plugin install afloury/wherdr --ref 2.x
MSG
exit 1
''']
