# Builds the website (website/, `nuxt generate`) and the browser demo (the app
# built with VITE_WHERDR_DEMO=1, served at /demo/), and deploys both to wherdr.dev
# as Cloudflare Workers static assets (website/wrangler.jsonc).
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID;
# without them the deploy job is skipped, not failed.
#
# Run by hand only, on v3: wherdr.dev stays v2's site (deployed by the push
# trigger of v2's site.yml, from `main` and later `2.x`), so merging v3 into
# `main` deploys nothing. Once website/ describes v3, run this workflow on
# `main` (docs/RELEASING.md, "Transition from v2 to v3", step 8).
name: site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  secrets:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set: the site is not deployed."
          fi

  demo:
    needs: secrets
    if: needs.secrets.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the demo
        run: npm run build:demo

      - uses: actions/upload-artifact@v7
        with:
          name: demo
          path: .output-demo/public/
          retention-days: 1

  deploy:
    needs: [secrets, demo]
    if: needs.secrets.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      # Only website/, the app's root
      # tsconfig.json (extending an ungenerated .nuxt) breaks the site build.
      # Whole history, without the file contents it does not check out:
      # sitemap.xml dates each page by the last commit of its sources.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: /website/
          sparse-checkout-cone-mode: false
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      - name: Generate
        run: npm run generate

      - uses: actions/download-artifact@v8
        with:
          name: demo
          path: website/.output/public/demo

      - name: Deploy
        # v4.1.3
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: deploy
