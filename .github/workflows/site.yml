# Builds the website (website/, `nuxt generate`) and the browser demo (the app
# built with VITE_WHERDR_DEMO=1, served at /demo/), and deploys both to wherdr.dev
# as Cloudflare Workers static assets (website/wrangler.jsonc).
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID;
# without them the deploy job is skipped, not failed.
#
# Deploys only when run by hand, on v3: wherdr.dev stays v2's site (deployed by the push
# trigger of v2's site.yml, from `main` and later `2.x`), so merging v3 into
# `main` deploys nothing. Once website/ describes v3, run this workflow on
# `main` (docs/RELEASING.md, "Transition from v2 to v3", step 8).
#
# On v3 pushes and pull requests that touch the site or what it imports, the
# `site` job only builds it, with the deploy's own sparse checkout, so a file the
# site imports from outside website/ fails here and not at deploy time.
name: site

on:
  workflow_dispatch:
  push:
    branches: [v3]
    paths: &site-sources
      - website/**
      - docs/install-with-an-agent.md
      - .github/workflows/site.yml
  pull_request:
    branches: [v3]
    paths: *site-sources

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'site-deploy' || format('site-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  secrets:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set: the site is not deployed."
          fi

  demo:
    needs: secrets
    if: needs.secrets.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the demo
        run: npm run build:demo

      # Home → board → task sheet → Tasks to review → Notes, on the built demo.
      - name: Demo smoke test
        run: |
          npx playwright install chromium
          npx playwright test tests/e2e/demo.spec.ts --project=chromium-phone

      - uses: actions/upload-artifact@v7
        with:
          name: demo
          path: .output-demo/public/
          retention-days: 1

  site:
    needs: [secrets, demo]
    # Builds on push and pull_request (secrets and demo skipped); deploys on a
    # manual run once the demo is built.
    if: >-
      !cancelled() && (github.event_name != 'workflow_dispatch'
      || (needs.secrets.outputs.ready == 'true' && needs.demo.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      # Only website/ and the docs it imports (app/utils/agentPrompts.ts): the
      # app's root tsconfig.json (extending an ungenerated .nuxt) breaks the site
      # build. A new import from outside website/ goes here and in `paths` above.
      # Whole history, without the file contents it does not check out:
      # sitemap.xml dates each page by the last commit of its sources.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /website/
            /docs/install-with-an-agent.md
          sparse-checkout-cone-mode: false
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      - name: Generate
        run: npm run generate

      - if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v8
        with:
          name: demo
          path: website/.output/public/demo

      - name: Deploy
        if: github.event_name == 'workflow_dispatch'
        # v4.1.3
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: deploy
