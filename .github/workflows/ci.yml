# v3 smoke checks: a few minutes, just to catch obvious breakage, plus the core smoke
# on WebKit for iOS-only breakage. The v2 suite (fake Herdr, desktop projects, sharded
# e2e, releases) lives on main and develop only.
# Merging v3 into main must keep the v2 ci.yml (its `checks` and `e2e` jobs are required).
name: ci

on:
  push:
    branches: [v3]
  pull_request:
    branches: [v3]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.28.0
  # Playwright's own image: Chromium, WebKit and their system libraries are baked in, so
  # the e2e steps download no apt packages (a slow Ubuntu mirror used to stall the WebKit
  # install). Keep its tag on the @playwright/test version in package-lock.json.
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble

jobs:
  smoke:
    runs-on: ubuntu-24.04
    # Safety net, about 3x a normal run (4-7 min). It stays above the point where a hung
    # install step hits its own limit (~4 min in + 10), so that step fails the run first:
    # a job timeout ends as "cancelled", a step timeout as "failed", which is re-run.
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx nuxt typecheck

      - name: Unit tests
        run: npx vitest run

      - name: Install gitleaks
        run: |
          curl -fsSL --retry 5 --retry-delay 15 --retry-all-errors "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Leak check
        run: npm run check:leaks

      - name: Build (herdr-core)
        run: npm run build

      # One image pull from Microsoft's registry instead of a browser download and apt.
      - name: Pull Playwright image
        timeout-minutes: 10
        run: docker pull "$PLAYWRIGHT_IMAGE"

      # Only the browsers run in the image; the unit tests above need the runner's tools.
      # The workspace (node_modules, the build) is mounted as the runner's user.
      - name: E2e (core, Chromium)
        run: >-
          docker run --rm --init --ipc=host --network=host --user "$(id -u):$(id -g)"
          -e CI -e HOME=/tmp -v "$PWD:$PWD" -w "$PWD" "$PLAYWRIGHT_IMAGE"
          npx playwright test --project=chromium-phone

      # Safari's engine: catches what iOS rejects and Chromium accepts (the /ws/events
      # handshake). The project's spec list lives in playwright.config.ts.
      - name: E2e (core smoke, WebKit)
        run: >-
          docker run --rm --init --ipc=host --network=host --user "$(id -u):$(id -g)"
          -e CI -e HOME=/tmp -v "$PWD:$PWD" -w "$PWD" "$PLAYWRIGHT_IMAGE"
          npx playwright test --project=webkit-phone
