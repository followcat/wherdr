# v3 smoke checks: a few minutes, just to catch obvious breakage, plus the core smoke
# on WebKit for iOS-only breakage. The v2 suite (fake Herdr, desktop projects, sharded
# e2e, releases) lives on main and develop only.
# Merging v3 into main must keep the v2 ci.yml (its `checks` and `e2e` jobs are required).
name: ci

on:
  push:
    branches: [v3]
  pull_request:
    branches: [v3]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.28.0

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx nuxt typecheck

      - name: Unit tests
        run: npx vitest run

      - name: Install gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Leak check
        run: npm run check:leaks

      - name: Build (herdr-core)
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2e (core, Chromium)
        run: npx playwright test --project=chromium-phone

      # Safari's engine: catches what iOS rejects and Chromium accepts (the /ws/events
      # handshake). Only tests/e2e/core-smoke.spec.ts runs here (playwright.config.ts).
      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: E2e (core smoke, WebKit)
        run: npx playwright test --project=webkit-phone
