# npm package `wherdr` (npx / bunx / pnpm dlx wherdr) published for each version tag
# (vX.Y.Z), through npm Trusted Publishing (OIDC): no NPM_TOKEN secret. On npmjs.com,
# the package's Trusted Publisher must name this repository and this file: npm.yml.
#
# release.yml dispatches this workflow once its publish-release job has made the GitHub
# release public with its package, so the archive always exists here. A tag push does not
# start it directly. A release published with GITHUB_TOKEN would not fire `release`
# events, but a workflow_dispatch does start. It can also be run by hand for an existing tag.
name: npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag (e.g. v1.3.3)'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.version }}
  GH_REPO: ${{ github.repository }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a version tag: $RELEASE_TAG"; exit 1
          fi
          gh release view "$RELEASE_TAG" --json tagName --jq .tagName

      # Never publish twice: a version already on npm ends the job successfully.
      - name: Check npm registry
        id: registry
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/wherdr/${RELEASE_TAG#v}")
          case "$status" in
            200) echo "::notice::wherdr@${RELEASE_TAG#v} is already on npm; nothing to publish."
                 echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::npm registry answered HTTP $status"; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        if: steps.registry.outputs.published == 'false'
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v7
        if: steps.registry.outputs.published == 'false'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or newer.
      - name: Install npm
        if: steps.registry.outputs.published == 'false'
        run: npm install -g npm@^11.5.1

      - name: Versions match the tag
        if: steps.registry.outputs.published == 'false'
        run: |
          ref="$RELEASE_TAG"
          pkg=$(node -p "require('./package.json').version")
          plugin=$(sed -n 's/^version = "\(.*\)"$/\1/p' herdr-plugin.toml)
          if [ "v$pkg" != "$ref" ]; then echo "::error::package.json version ($pkg) does not match tag $ref"; exit 1; fi
          if [ "v$plugin" != "$ref" ]; then echo "::error::herdr-plugin.toml version ($plugin) does not match tag $ref"; exit 1; fi

      # Publish the exact package attached by release.yml, never a second build.
      - name: Download the release package
        if: steps.registry.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release download "$RELEASE_TAG" --pattern "wherdr-${version}.tgz*" --dir package --clobber
          cd package
          sha256sum -c "wherdr-${version}.tgz.sha256"

      - name: Publish
        if: steps.registry.outputs.published == 'false'
        run: npm publish "./package/wherdr-${RELEASE_TAG#v}.tgz" --provenance --access public
